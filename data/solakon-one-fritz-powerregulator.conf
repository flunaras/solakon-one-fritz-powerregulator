# solakon-one-fritz-powerregulator configuration file
# ─────────────────────────────────────────────────────────────────────────────
# All options correspond to their long CLI flag names (without the leading --).
# Lines starting with '#' are comments.  Blank lines are ignored.
# CLI flags always take precedence over values set here.
#
# Default location: /etc/solakon-one-fritz-powerregulator/solakon-one-fritz-powerregulator.conf
# Override with:    solakon-one-fritz-powerregulator --config /path/to/other.conf
# ─────────────────────────────────────────────────────────────────────────────

# ── Solakon ONE (Modbus TCP) ──────────────────────────────────────────────────

# Hostname or IP address of the Solakon ONE inverter.
# Can be:
#   - A static IP address (e.g., 192.168.1.1)
#   - A DNS hostname (e.g., inverter.example.com)
#   - An mDNS hostname (e.g., solakon-abc123.local)
# To find available mDNS names on your network, run:
#   solakon-one-fritz-powerregulator discover-mdns
# solakon-host = 192.168.1.1

# Modbus TCP port (default is the standard Modbus port).
# solakon-port = 502

# Modbus slave / unit ID.
# solakon-slave-id = 1

# ── FRITZ!Box Smart Home ─────────────────────────────────────────────────────

# Hostname or IP address of the FRITZ!Box router.
# fritz-host = fritz.box

# Connection scheme for the FRITZ!Box REST API: "http" (default) or "https".
# Use "https" if your FRITZ!Box is configured to require encrypted access.
# Combine with fritz-ignore-ssl = true if the certificate is self-signed.
# fritz-scheme = http

# FRITZ!Box login username.
# fritz-username =

# FRITZ!Box login password.
# fritz-password =

# AIN (actor identification number) of the Smart Home device to read power from.
# Obtain the AIN by running:
#   solakon-one-fritz-powerregulator --fritz-host fritz.box \
#     --fritz-username admin --fritz-password secret read-fritz
# Spaces in the AIN are ignored.
# fritz-ain =

# Set to true to ignore TLS certificate errors (e.g. self-signed FRITZ!Box cert).
# fritz-ignore-ssl = false

# ── Device filter ─────────────────────────────────────────────────────────────

# fritz-filter-product restricts which FRITZ!Box Smart Home devices are shown by
# list-fritz-devices and are accepted as valid by check-fritz-device, read-fritz-device,
# and the run-loop suitability check.  Each value is a case-insensitive substring match
# against the device's product name as reported by the FRITZ!Box REST API.
# A device passes if its product name contains ANY of the listed substrings.
# Repeat the key to allow multiple products.
#
# Default: "FRITZ!Smart Energy 250"
# The FRITZ!Smart Energy 250 is the ONLY FRITZ!Smart Energy device that supports
# bidirectional metering — it can tell the difference between power consumed from the
# grid and power exported to the grid.  All other FRITZ!Smart Energy models measure
# only net consumption and cannot distinguish the direction of power flow.  Using any
# other model as the run-loop input will produce incorrect setpoints.
#
# To allow multiple products, repeat the key:
#   fritz-filter-product = FRITZ!Smart Energy 250
#   fritz-filter-product = FRITZ!Smart Energy 350
#
# To disable the filter entirely (accept any product), remove all fritz-filter-product
# lines or pass no --fritz-filter-product arguments on the command line.
#
# fritz-filter-product = FRITZ!Smart Energy 250

# Filter devices by capability type (case-sensitive substring match against the
# comma-separated capability list reported by the FRITZ!Box REST API).
# Known capabilities: switch, energyMeter, temperatureSensor, thermostat,
#   dimmer, colorBulb, blind, humiditySensor, alarm.
# Empty / absent = no filter (default).
# fritz-filter-type =

# ── Control ───────────────────────────────────────────────────────────────────

# Maximum export power setpoint in watts.  The computed setpoint (run-loop) and
# the explicit value (write-solakon) are both clamped to this limit before being
# sent to the inverter.  Set this to match your grid connection limit or local
# regulations (e.g. 800 W for the German Balkonkraftwerk limit).
# max-power = 800

# Poll interval for run-loop in seconds.  0 = run once and exit.
# interval = 60

# Extra seconds added to the interval for the inverter revert timeout.
# The inverter returns to normal operation if no new setpoint is received within
# (interval + loop-timeout-extra) seconds.  Useful as a safety net if the process
# crashes between cycles.
# loop-timeout-extra = 30

# Dry-run mode: read values and compute setpoint but do not write to Solakon ONE.
# dry-run = false

# ── Anti-oscillation / stability ─────────────────────────────────────────────

# The control loop reads grid power (solakon_grid_power_w) and FRITZ!Box
# device power (grid_meter_power_w), then writes
# solakon_grid_power_w + grid_meter_power_w as the new setpoint.  Because the
# inverter reacts to the setpoint and changes solakon_grid_power_w before the
# next cycle, the loop can oscillate if the combined setpoint is written
# without damping.  The two options below address this independently.
#
# EMA smoothing factor (0.0–1.0), applied to each GENUINE update (i.e. one
# with a real, non-repeated FRITZ!Box reading — a repeated/stale reading never
# blends into the EMA at all; see fritz-stuck-cycles below).
#   new_setpoint = alpha × raw + (1 − alpha) × prev_setpoint
# 1.0 = no smoothing (track measurements exactly — default, current behaviour).
# Lower values slow the response and reduce oscillation.
#
# alpha is NOT simply this value — it is scaled by the ACTUAL elapsed
# wall-clock time (dt) since the previous genuine update, relative to
# `interval`:  alpha = 1 − (1 − smoothing) ^ (dt / interval)
# smoothing is thus "the fraction of the gap closed by a genuine update that
# arrives exactly `interval` seconds after the previous one".  The FRITZ!Box's
# own refresh cadence is not fixed (observed anywhere from ~10 s to ~110 s in
# the field, varying over time on the same device), so this keeps smoothing
# meaning the same thing in real time regardless of how sparse or dense
# genuine updates happen to be — no need to measure or configure the refresh
# rate anywhere: a rare update after a long gap is trusted close to fully
# (alpha → 1); a suspiciously quick one is trusted less.
# Suggested starting point: 0.5
# smoothing = 1.0
#
# Maximum rate of change, in watts per second of REAL elapsed time, allowed
# for the WRITTEN setpoint.  Applied AFTER smoothing/jitter, as a separate,
# independent bound — smoothing governs how much a fresh reading is trusted
# (and, after a long refresh gap, correctly trusts it almost fully); this
# instead bounds how large a single write's STEP may be regardless of how far
# the underlying target has moved, protecting the inverter/battery from an
# abrupt commanded swing.
# Measured since the most recent write of ANY kind, including keep-alive
# refreshes that re-send an unchanged setpoint — so a long quiet spell (even
# one filled with keep-alive pings) never "banks" an oversized jump allowance;
# the limit stays a tight, predictable bound on every single write.  The very
# first write of a fresh engagement (cold start or post-release regain) is
# exempt: there is no previous commanded value yet to ramp from.
# Default: 0 = disabled (no rate limit).
# max-ramp-w-per-s = 0
#
# Output-side dead band in watts.
# Skips the Solakon ONE write in two situations:
#   1. Output-side: |new_setpoint - last_written| < min-change.
#   2. Input-side:  |Δsolakon_grid_power_w| < min-change AND
#                   |Δgrid_meter_power_w| < fritz-min-change
#                   (i.e. neither input has moved meaningfully since the
#                   previous cycle).
# The default of 1 suppresses redundant writes when the inverter export is
# byte-stable, in addition to filtering sub-watt measurement noise.
# Set to 0 to disable (always write).
# min-change = 1
#
# FRITZ!Box-side dead band in watts.
# Minimum |Δgrid_meter_power_w| since the previous cycle that counts as a
# real change.  Combined with min-change as an input-side guard: the write is
# skipped when BOTH |Δsolakon_grid_power_w| < min-change AND
# |Δgrid_meter_power_w| < fritz-min-change.
# Rationale: the FRITZ!Smart Energy 250 polls its internal energy data on a
# ~2-minute interval and rounds its REST output to whole watts.  Successive
# reads at our cycle rate (8–60 s) therefore show ±3..±10 W noise even when
# the household load is stable.  Without this guard, each noise spike pushes
# the solakon_grid_power_w+grid_meter_power_w setpoint, the inverter ramps to
# match, and on the next cycle the elevated solakon_grid_power_w plus a
# reverted grid_meter_power_w produces yet another change — a slow upward
# drift of the setpoint despite a stable load.
# Default: 3 W. Set to 0 to disable.
# fritz-min-change = 3
#
# FRITZ!Box stuck-data detection: consecutive cycles the FRITZ!Box may return
# the EXACT same grid_meter_power_w value before the tool gives up and fully
# suppresses writes.
# A real-world household load fluctuates by at least ±1 W from second to
# second; the FRITZ device returning the same byte-equal value for many
# cycles in a row strongly indicates that its internal energy-data cache has
# not refreshed.  Rather than going silent the instant grid_meter_power_w
# repeats, cycles BEFORE this threshold still write, but with a small
# alternating +-1/+-2 W jitter added to the setpoint instead of the unchanged
# solakon_grid_power_w + grid_meter_power_w value, keeping the loop visibly
# alive without pretending the stale reading justifies a real setpoint
# change.  Only once the counter REACHES this threshold does the tool log a
# warning and skip the write entirely until grid_meter_power_w changes; the
# counter resets on the first changed reading either way.
# Default: 3 cycles. Set to 0 to disable stuck-data detection (and its
# jitter) entirely.
# fritz-stuck-cycles = 3

# Target value (W) the FRITZ!Box grid-power reading grid_meter_power_w
# should be held at, instead of 0.  The tool computes and holds
# setpoint = solakon_grid_power_w + (grid_meter_power_w - baseline),
# steering the household towards importing/exporting this many watts at the
# FRITZ!Box meter rather than towards net zero.  A positive value keeps a
# small standing import (e.g. to leave headroom for another circuit not
# visible to the Solakon ONE); a negative value keeps a small standing
# export.  This baseline shift also applies to the release-eligibility
# export-growing check and the post-release recover decision (both treat the
# baseline as the new zero for grid_meter_power_w).  fritz-min-change and
# fritz-stuck-cycles above still operate on the raw grid_meter_power_w
# reading, independent of this baseline.
# Default: 0 (matches the original "hold grid_meter_power_w at zero"
# behavior).
# fritz-baseline-w = 0

# ── Remote-control release ───────────────────────────────────────────────────

# When the battery is full and the PV array is still producing surplus, the
# remote-control setpoint stops being useful: it caps the inverter's export
# at solakon_grid_power_w + grid_meter_power_w, which is much less than the
# available PV.  Releasing remote control lets the inverter revert to its
# configured work mode (typically Self Use, which exports all PV surplus
# after covering loads).
#
# Release is a two-part decision: RELEASE ELIGIBILITY (below) is a fixed set
# of conditions checked fresh every cycle; the moment ALL of them hold, remote
# control is released IMMEDIATELY, as a real-world behavioural test — there is
# no debounce on this side. The RECOVER decision watches the FRITZ!Box reading
# grid_meter_power_w afterwards to confirm the release was correct (see
# release-debounce-cycles below); a wrong call is corrected within a bounded
# number of cycles.
#
# Two earlier release conditions — "work mode must be Self Use" and "PV power
# must exceed a threshold" — proved unreliable in the field (e.g. some
# inverters/firmware leave WORK_MODE stuck at a non-Self-Use value
# indefinitely, permanently blocking release) and have been removed rather
# than replaced by further indirect proxies.
#
# Release eligibility — ALL of the following must hold on the SAME cycle:
#   1. We own the remote-control session (we engaged it ourselves; not the
#      FoxESS app or a leftover from a previous run).
#   2. SoC >= MAX_SOC - release-soc-hysteresis  (battery is full).
#   3. BATTERY_COMBINED_POWER <= battery-dead-band  (battery is not charging).
#   4. TOTAL_PV_POWER > ACTIVE_POWER (solakon_grid_power_w) + release-pv-margin
#      (releasing could actually export more than we already do under our
#      own setpoint).
#   5. grid_meter_power_w < 0, OR solakon_grid_power_w > solakon_grid_power_w
#      when the current engagement started  (the export situation is already
#      favourable, or has net improved since we last took control — compared
#      against a fixed starting point rather than the previous cycle, since
#      solakon_grid_power_w need not rise on every single cycle).
#   6. Inverter is in normal Operation (not Standby/Fault/Off-Grid).
#   7. solakon_grid_power_w + grid_meter_power_w <= release-threshold
#      (if release-threshold > 0; default 0 = off).
# If any required Modbus read fails, the corresponding condition is treated as
# "not safe" and release is inhibited (safe-fail).
#
# Recover decision — once released, the tool watches ONLY the FRITZ!Box
# reading grid_meter_power_w (not SoC, not battery power, not inverter state
# — those already had their say above): if grid_meter_power_w > 0 (the
# household is net-importing from the grid) for release-debounce-cycles
# CONSECUTIVE cycles, remote control is regained.  Any cycle where
# grid_meter_power_w <= 0 resets that counter to 0.  The very first
# engagement after process start is not subject to this test — with nothing
# to recover from yet, the tool simply takes control on its first cycle.
#
# Combined-setpoint (solakon_grid_power_w + grid_meter_power_w) safety-net
# threshold in watts.
# Default 0 disables this condition entirely — release eligibility is decided
# purely by SoC, battery-charging state, and inverter operational state.  Set
# to a positive value to add the legacy "solakon_grid_power_w +
# grid_meter_power_w near zero" constraint as an additional requirement
# (release fires only when solakon_grid_power_w + grid_meter_power_w is also
# at or below this value).
# release-threshold = 0
#
# SoC hysteresis in percentage points below MAX_SOC at which release becomes
# eligible.  Example: MAX_SOC = 95 %, hysteresis = 2 → release allowed when
# SoC >= 93 %.  The hysteresis prevents flap when SoC briefly oscillates
# around the MAX_SOC limit due to BMS top-off behaviour and small loads
# pulling SoC down by a percent or two.
# Default: 3 %.  Set to 0 to require SoC to reach the full MAX_SOC limit.
# release-soc-hysteresis = 2
#
# Regain-control debounce: NOT a pre-release debounce (release fires the
# instant all eligibility conditions above hold on a single cycle — that
# release IS the behavioural test).  This instead governs the opposite
# direction: once released, remote control is regained when the FRITZ!Box
# reading grid_meter_power_w is positive (importing) for this many
# CONSECUTIVE cycles.  Any cycle where grid_meter_power_w <= 0 resets the
# counter to 0, so remote control stays released.
# Default: 2 cycles.  Set to 0 or 1 to regain control on the first cycle
# grid_meter_power_w is positive (no debounce).
# release-debounce-cycles = 2
#
# Threshold in watts above which the battery is considered actively CHARGING;
# release is refused while charging, because a charging battery can still
# absorb whatever PV surplus the remote-control setpoint is currently
# clipping — releasing would gain nothing.  Battery readings at or below this
# threshold — idling OR discharging — are treated as "not charging" and do
# not block release; discharging is in fact the expected state immediately
# after the battery reaches MAX_SOC.  The threshold (rather than a strict
# battery_w <= 0 test) absorbs LiFePO4 trickle/float charge current
# (+5..+20 W of BMS cell-balancing current) that would otherwise read as
# "charging" indefinitely and lock release out once SoC has already hit
# MAX_SOC.
# Default: 20 W.  Set to 0 to require the strict battery_w <= 0 behaviour.
# battery-dead-band = 20
#
# Minimum margin in watts by which TOTAL_PV_POWER must exceed the current
# ACTIVE_POWER (solakon_grid_power_w) before a release is even attempted.
# While engaged, solakon_grid_power_w is (approximately) whatever we last
# commanded the inverter to export.
# Releasing can only ever increase the export up to what PV can supply once
# the battery stops absorbing more (see battery-dead-band above), so unless
# PV is comfortably above what is already being exported, there is no PV
# surplus left for a release to unlock — testing one has no possible upside,
# only the risk of a spurious release immediately undone by the recover
# decision (release-debounce-cycles).
# Default: 10 W.  A larger margin requires more headroom before a release is
# tested; a negative value relaxes (or, sufficiently negative, effectively
# disables) the guard.
# release-pv-margin = 10
#
# Recover ownership state on start.  Reads REMOTE_CONTROL (register 46001) on
# startup; if bit 0 is set, the setpoint belongs to someone else (a previous
# instance that did not exit cleanly, or the FoxESS app's "strategy periods"
# feature).  The tool will NOT release that setpoint — it would otherwise
# silently cancel an active app schedule.  Release becomes eligible only after
# our own writeRemoteControl has succeeded.
# Default: true.  Disable only for diagnostic runs.
# recover-remote-on-start = true
#
# Settle delay in milliseconds after a successful writeRemoteControl OR
# releaseRemoteControl, before the next cycle's reads.  The FoxESS inverter
# ramps its output over 1–3 s after either transition; reading
# solakon_grid_power_w/grid_meter_power_w immediately afterwards gives a
# value partway through the ramp.  For writes this causes systematic
# overcorrection; for releases it would pollute the very first
# grid_meter_power_w reading the recover test (above) relies on with a
# transient rather than the inverter's settled free-run state.
# Default: 2000 ms.  Set to 0 to disable.
# settle-delay-ms = 2000

# ── Minimum-SoC control cutoff (independent of the release-when-full block) ──

# A separate, independent safety cutoff: the minimum battery SoC required for
# the tool to hold or take remote control of the Solakon ONE at all.  Where
# the block above releases control when the battery is FULL (to stop wasting
# PV surplus), this one releases control when the battery is LOW, to stop the
# solakon_grid_power_w+grid_meter_power_w setpoint from forcing further
# battery discharge once there is little charge left to give.  It is NOT tied
# to the inverter's own MIN_SOC register (46609, the user's "stop discharging"
# limit) — it is an entirely separate, directly configured value.
#
# Release here is a hard cutoff: the instant BMS1_SOC drops below
# min-control-soc, remote control is released immediately, gated only by SoC
# itself and session ownership — none of battery-dead-band,
# release-pv-margin, the export-growing trend, or inverter health apply (they
# answer a different question that doesn't apply here).
# "Minimum charge required to control" is literal: if SoC already reads below
# this value at a true cold start, the tool withholds control from the very
# first cycle instead of engaging unconditionally the way a normal cold start
# does.
#
# Recovery is purely SoC-driven and immediate: no debounce cycles, no
# dependency on the FRITZ!Box reading grid_meter_power_w (unlike the
# release-when-full recover decision above).  The instant BMS1_SOC rises back
# up to min-control-soc-recover, control resumes.
#
# Minimum battery SoC (%) required to hold or take remote control.
# Default: 10.  Set to 0 to disable this cutoff.
# min-control-soc = 10
#
# Absolute SoC (%) that BMS1_SOC must rise back up to before control resumes after a
# min-control-soc release.  A second, independently configured absolute value — not
# an offset — so the effective hysteresis band is
# (min-control-soc-recover - min-control-soc).  Must be >= min-control-soc; if
# configured lower, it is clamped up to min-control-soc at startup (zero-width
# band) and a warning is logged.
# Default: 15.
# min-control-soc-recover = 15
#
# Path to a small JSON file used to persist the low-SoC hold state above
# across process/service restarts -- without this, a restart (crash, package
# upgrade, reboot) would forget the battery was too low to hold remote
# control and resume forcing export/discharge from a normal, unconditional
# cold start.  The parent directory is created if missing.  The state can
# also be queried/toggled live via GET/POST /api/v1/low-soc-hold (see the
# REST API section below).  Set to "" to disable persistence entirely.
# Default: /var/lib/solakon-one-fritz-powerregulator/state.json
# state-file = /var/lib/solakon-one-fritz-powerregulator/state.json

# ── Grid import ─────────────────────────────────────────────────────────────

# By default, whenever the computed solakon_grid_power_w + grid_meter_power_w
# setpoint would be negative (the inverter would need to import from the grid
# to cover the load), the tool clamps the setpoint to 0 and lets the inverter
# fall back to whatever it can supply from PV/battery alone.  Enabling this
# option instead actively commands the inverter to IMPORT the shortfall from
# the grid, using the same remote-control mechanism that pushes the export
# setpoint up when there is a surplus.  The import magnitude is bounded by
# max-power, same as export setpoints, and all anti-oscillation guards
# (smoothing, max-ramp-w-per-s, min-change, fritz-min-change/
# fritz-stuck-cycles) apply identically.
# Default: false (disabled).
# enable-grid-import = false

# ── REST API ──────────────────────────────────────────────────────────────────

# Optional HTTP REST API for reading all current parameters and setting a
# manual grid import/export override or a timed force-release of remote
# control.  Runs in-process alongside run-loop (not a separate daemon);
# disabled by default.
#
# Endpoints (all under /api/v1):
#   GET    /api/v1/health     - unauthenticated liveness probe
#   GET    /api/v1/status     - current Solakon/FRITZ!Box readings and
#                               control state
#   GET    /api/v1/override   - current manual override state
#   POST   /api/v1/override   - set a manual override; JSON body is EITHER:
#                                 {"watts": <int>, "duration_seconds": <int, optional>}
#                                   -- command an explicit setpoint every cycle;
#                                   positive = export, negative = import (import
#                                   requires no special config -- an override is
#                                   explicit operator intent); duration_seconds
#                                   auto-expires the override (0 = indefinite)
#                                   and also sets the Modbus revert timeout
#                                   used for each write
#                               OR
#                                 {"release": true, "duration_seconds": <int, optional>}
#                                   -- force-release remote control; omitted or 0
#                                   duration_seconds stays released until
#                                   explicitly cleared, otherwise normal control
#                                   resumes automatically after that many seconds
#   DELETE /api/v1/override   - clear the override, resuming normal
#                               solakon_grid_power_w + grid_meter_power_w
#                               control immediately
#
# While a manual override is active it takes ABSOLUTE priority over the
# normal solakon_grid_power_w + grid_meter_power_w control loop and the
# release/recover state machine.  Both modes share the same duration_seconds
# auto-expiry mechanism (0 = stays active indefinitely, until explicitly
# cleared via DELETE):
#   - Setpoint mode: every cycle simply (re)writes the requested wattage
#     (clamped to max-power). duration_seconds is ALSO passed as the Modbus
#     revert timeout for each write, so the inverter's own safety-net timeout
#     never lags behind the override's own auto-expiry.
#   - Release mode: the remote-control session is released immediately and no
#     setpoint is written while it stays active.
# In both modes, once duration-seconds elapses (if set), the override clears
# itself and the normal release/recover state machine resumes immediately, in
# the very same cycle the expiry is detected.
#
# Every request (except /api/v1/health) must present the configured api-key,
# via EITHER header:
#   Authorization: Bearer <api-key>
#   X-API-Key: <api-key>
#
# Master switch.  Default: false (disabled).
# api-enabled = false
#
# Address the REST API listener binds to.  Use 0.0.0.0 to listen on all
# interfaces (e.g. to reach the API from elsewhere on the LAN); the default
# restricts access to the local host only.
# Default: 127.0.0.1
# api-host = 127.0.0.1
#
# TCP port for the REST API listener.
# Default: 8080
# api-port = 8080
#
# Shared-secret API key required on every request (see above).  Required
# (non-empty) whenever api-enabled is true -- the tool refuses to start the
# API otherwise rather than exposing it with no authentication at all.
# api-key =
#
# Serve the REST API over HTTPS instead of plain HTTP.
# Default: false (disabled).
# api-tls-enabled = false
#
# Path to a PEM certificate (chain) file and matching private key file for
# the TLS listener.  Both must be set together, or both left empty.
#
# When both are left empty (the default) while api-tls-enabled is true, the
# tool generates an RSA-2048, SHA-256 self-signed certificate in memory at
# startup (never written to disk; a new one is generated on every restart).
# Convenient for local/LAN use without provisioning real certificates, but
# API clients must either disable certificate verification or explicitly
# trust/pin the generated certificate -- this mode is NOT suitable for a
# public-facing deployment.
#
# Set both to use a real certificate instead, e.g. one issued by an internal
# CA, a public CA, or obtained via a reverse proxy's ACME client.
# api-tls-cert-file =
# api-tls-key-file =

# ── Logging ───────────────────────────────────────────────────────────────────

# Log level: 0=silent  1=error (default)  2=warn  3=info  4=debug  5=trace
# All log output goes to stderr.
# log-level = 1
